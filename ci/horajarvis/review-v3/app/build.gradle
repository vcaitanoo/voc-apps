plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.vcaitano.horajarvis'
    compileSdk 36

    defaultConfig {
        applicationId 'pt.vcaitano.horajarvis'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0-lab'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.lab'
        }
        release {
            minifyEnabled false
        }
    }
}
