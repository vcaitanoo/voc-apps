name: Import Damas v1.0.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-damas-v100.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact validated Damas artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://sdmntprukwest.oaiusercontent.com/files/00000000-6ae4-8243-9c8f-6101a7b4dc67/raw?se=2026-08-17T03%3A52%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=f52d7666-3969-54b2-b100-89a7475607bb&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T20%3A23%3A27Z&ske=2026-08-17T20%3A23%3A27Z&sks=b&skv=2026-02-06&sig=mjhQDV/rvWyt%2BCGax5WCEMCzLg/oJ2DyNw0e2ot24fU%3D' \
            --output /tmp/damas-v100-artifact.zip
          rm -rf /tmp/damas-v100
          mkdir -p /tmp/damas-v100
          unzip -q /tmp/damas-v100-artifact.zip -d /tmp/damas-v100
          APK='/tmp/damas-v100/Damas-v1.0.0.apk'
          ICON='/tmp/damas-v100/Damas-icon.webp'
          test -f "$APK"
          test -f "$ICON"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = '45f6eb4931519bf129bff48dca266bf9ca264e0a0891f3c9295789d234f82730'
          mkdir -p apks/damas/v1.0 icons
          cp "$APK" apks/damas/v1.0/Damas-v1.0.0.apk
          cp "$ICON" icons/damas.webp
          test "$(sha256sum apks/damas/v1.0/Damas-v1.0.0.apk | cut -d' ' -f1)" = '45f6eb4931519bf129bff48dca266bf9ca264e0a0891f3c9295789d234f82730'

      - name: Commit APK and icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apks/damas/v1.0/Damas-v1.0.0.apk icons/damas.webp
          git commit -m 'release: add Damas v1.0.0 APK and icon'
          git push origin HEAD:main
