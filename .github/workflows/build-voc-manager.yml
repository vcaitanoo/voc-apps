name: Build voc Manager

on:
  push:
    paths:
      - 'manager/**'
      - '.github/workflows/build-voc-manager.yml'
  pull_request:
    paths:
      - 'manager/**'
      - '.github/workflows/build-voc-manager.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and test
        run: gradle -p manager clean testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK metadata
        shell: bash
        run: |
          APK='manager/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='pt.vcaitano.vocmanager' versionCode='5' versionName='1.2.1'" /tmp/badging.txt
          grep -q "application-label:'voc Manager'" /tmp/badging.txt
          sha256sum "$APK" | tee manager/app/build/outputs/apk/debug/apk-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voc-manager-v1.2.1-debug
          path: |
            manager/app/build/outputs/apk/debug/app-debug.apk
            manager/app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error
