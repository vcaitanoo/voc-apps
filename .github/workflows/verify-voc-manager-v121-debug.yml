name: Verify voc Manager 1.2.1 manual update behavior

on:
  pull_request:
    paths:
      - 'delivery/voc-manager-v121-trigger.txt'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p manager clean testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK metadata
        run: |
          APK="manager/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee manager-badging.txt
          grep -q "package: name='pt.vcaitano.vocmanager' versionCode='5' versionName='1.2.1'" manager-badging.txt
          sha256sum "$APK" | tee manager-sha256.txt

      - name: Install emulator image
        run: |
          set -u
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Verify no automatic update and manual button update
        shell: bash
        run: |
          set -euo pipefail
          APK="manager/app/build/outputs/apk/debug/app-debug.apk"
          OLD_TV="apks/voc-tv/v0.17/vocTV-v0.17.apk"
          test -s "$OLD_TV"

          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd -n voc_manager_test -k "system-images;android-35;google_apis;x86_64" -p "$ANDROID_AVD_HOME/voc_manager_test.avd" --force
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          if [ -e /dev/kvm ]; then ACCEL_ARGS="-accel on"; else ACCEL_ARGS="-accel off"; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd voc_manager_test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect $ACCEL_ARGS > emulator.log 2>&1 &
          EMULATOR_PID=$!

          READY=0
          for i in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat emulator.log; exit 1; fi
            if adb devices | grep -q '^emulator-.*device$' && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = "1"

          adb install -r "$APK" | tee manager-install.txt
          grep -q "Success" manager-install.txt
          adb install -r -i pt.vcaitano.vocmanager "$OLD_TV" | tee old-tv-install.txt
          grep -q "Success" old-tv-install.txt
          adb shell appops set pt.vcaitano.vocmanager REQUEST_INSTALL_PACKAGES allow

          BEFORE="$(adb shell dumpsys package pt.vcaitano.iptvia | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
          test "$BEFORE" = "17"

          adb logcat -c
          adb shell am start -n pt.vcaitano.vocmanager/.MainActivity | tee manager-start.txt
          sleep 12

          STILL_OLD="$(adb shell dumpsys package pt.vcaitano.iptvia | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
          echo "version_after_open_without_click=$STILL_OLD" | tee no-auto-update-result.txt
          test "$STILL_OLD" = "17"

          # First prove that the card reports an update while the installed app
          # remains untouched. On the small emulator viewport the update button
          # is initially below the fold, so scroll until it is visible.
          adb shell uiautomator dump /sdcard/manager-before.xml >/dev/null 2>&1
          adb pull /sdcard/manager-before.xml manager-ui-before.xml >/dev/null 2>&1
          grep -q "ATUALIZAÇÃO DISPONÍVEL" manager-ui-before.xml

          BUTTON_VISIBLE=0
          for i in $(seq 1 5); do
            adb shell uiautomator dump /sdcard/manager-action.xml >/dev/null 2>&1
            adb pull /sdcard/manager-action.xml manager-ui-action.xml >/dev/null 2>&1
            if grep -q "ATUALIZAR PARA 0.18.0" manager-ui-action.xml; then
              BUTTON_VISIBLE=1
              break
            fi
            adb shell input swipe 160 575 160 300 350
            sleep 1
          done
          echo "manual_button_visible=$BUTTON_VISIBLE" | tee manual-button-result.txt
          test "$BUTTON_VISIBLE" = "1"

          read TAP_X TAP_Y < <(python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('manager-ui-action.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'ATUALIZAR PARA 0.18.0':
                  m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if not m:
                      raise SystemExit('button bounds not found')
                  x1, y1, x2, y2 = map(int, m.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          else:
              raise SystemExit('update button not found')
          PY
          )
          echo "manual_button_tap=$TAP_X,$TAP_Y" | tee manual-button-tap.txt
          adb shell input tap "$TAP_X" "$TAP_Y"

          UPDATED=0
          for i in $(seq 1 90); do
            CURRENT="$(adb shell dumpsys package pt.vcaitano.iptvia | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
            if [ "$CURRENT" = "18" ]; then UPDATED=1; break; fi
            sleep 1
          done
          echo "manual_update_result=$UPDATED" | tee manual-update-result.txt
          test "$UPDATED" = "1"

          adb logcat -d -t 4000 > manager-logcat.txt || true
          if grep -q "FATAL EXCEPTION" manager-logcat.txt; then
            grep -A40 -B10 "FATAL EXCEPTION" manager-logcat.txt
            exit 1
          fi

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voc-manager-v1.2.1-manual-update-evidence
          path: |
            manager/app/build/outputs/apk/debug/app-debug.apk
            manager-badging.txt
            manager-sha256.txt
            manager-install.txt
            old-tv-install.txt
            manager-start.txt
            manager-ui-before.xml
            manager-ui-action.xml
            no-auto-update-result.txt
            manual-button-result.txt
            manual-button-tap.txt
            manual-update-result.txt
            manager-logcat.txt
            emulator.log
          if-no-files-found: warn
