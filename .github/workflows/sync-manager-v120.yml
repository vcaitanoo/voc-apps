name: Sync voc Manager v1.2.0 source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-manager-v120.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy exact validated Manager source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='f552f5f28fd9bdccfa3123e3097da6952292eedb'
          git fetch origin "$SOURCE_SHA"
          git checkout "$SOURCE_SHA" -- \
            manager/app/build.gradle.kts \
            manager/app/src/main/AndroidManifest.xml \
            manager/app/src/main/java/pt/vcaitano/vocmanager/ApkInstaller.java \
            manager/app/src/main/java/pt/vcaitano/vocmanager/CatalogClient.java \
            manager/app/src/main/java/pt/vcaitano/vocmanager/InstallResultReceiver.java \
            manager/app/src/main/java/pt/vcaitano/vocmanager/MainActivity.java \
            .github/workflows/build-voc-manager.yml \
            .github/workflows/test-voc-manager-emulator.yml
          git diff --check
          git config user.name 'voc Manager Build Bot'
          git config user.email '162039938+vcaitanoo@users.noreply.github.com'
          git add manager .github/workflows/build-voc-manager.yml .github/workflows/test-voc-manager-emulator.yml
          if git diff --cached --quiet; then
            echo 'Source already synchronized.'
          else
            git commit -m 'feat(manager): sync validated v1.2.0 source'
            git push origin HEAD:main
          fi
