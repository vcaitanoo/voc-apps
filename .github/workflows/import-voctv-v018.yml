name: Import voc TV v0.18 APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-voctv-v018.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact validated v0.18 artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL='https://sdmntprnortheu.oaiusercontent.com/files/00000000-32f8-81f4-9db6-fb5c6632528b/raw?se=2026-08-17T04%3A01%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=443c4dcf-f6bb-577e-af67-11ef8da84b5a&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T20%3A31%3A49Z&ske=2026-08-17T20%3A31%3A49Z&sks=b&skv=2026-02-06&sig=64Ndudfcroyq0%2B2Ms88KCx2wWNy/epKXWyut7alN3rA%3D'
          curl -fL --retry 4 --retry-delay 2 "$SOURCE_URL" -o /tmp/voctv-v018-artifact.zip
          echo 'c6abf7184a3b2d16d0cb540fef4a38ba6917d6ed169f276dfb19b3203b56e986  /tmp/voctv-v018-artifact.zip' | sha256sum -c -
          rm -rf /tmp/voctv-v018-artifact
          mkdir -p /tmp/voctv-v018-artifact
          unzip -q /tmp/voctv-v018-artifact.zip -d /tmp/voctv-v018-artifact
          APK='/tmp/voctv-v018-artifact/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo '2ca9767b0466286fb6aeb04ac7859c3b89f773dd3a7df9773ca8f238d99619f2  /tmp/voctv-v018-artifact/app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
          mkdir -p apks/voc-tv/v0.18
          cp "$APK" apks/voc-tv/v0.18/vocTV-v0.18.apk

      - name: Commit exact APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'voc Manager Bot'
          git config user.email '162039938+vcaitanoo@users.noreply.github.com'
          git add apks/voc-tv/v0.18/vocTV-v0.18.apk
          git commit -m 'release: voc TV v0.18 multi-M3U'
          git push
