name: Import voc TV v0.17

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-voc-tv-v017.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact validated artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-edfc-81f4-bc8c-3ec33a4693a5/raw?se=2026-08-17T03%3A05%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=f96c3bc6-adfc-5c56-bdad-5c6b485f86d3&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T06%3A09%3A01Z&ske=2026-08-17T06%3A09%3A01Z&sks=b&skv=2026-02-06&sig=lDmJOeBPt1zkpTFyIfSqvKO9O0OnXp5ELDd3pL78QfU%3D' \
            --output /tmp/voc-tv-v017-artifact.zip
          rm -rf /tmp/voc-v017
          mkdir -p /tmp/voc-v017
          unzip -q /tmp/voc-tv-v017-artifact.zip -d /tmp/voc-v017
          APK='/tmp/voc-v017/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = '4935e435f2ece103121aac55d2f55fe3839c6adf06bb8fc4e45b5ac05e4dc4d4'
          mkdir -p apks/voc-tv/v0.17
          cp "$APK" apks/voc-tv/v0.17/vocTV-v0.17.apk
          test "$(sha256sum apks/voc-tv/v0.17/vocTV-v0.17.apk | cut -d' ' -f1)" = '4935e435f2ece103121aac55d2f55fe3839c6adf06bb8fc4e45b5ac05e4dc4d4'

      - name: Commit APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apks/voc-tv/v0.17/vocTV-v0.17.apk
          git commit -m 'release: add voc TV v0.17 APK'
          git push origin HEAD:main
