name: Check VOC Trader Vision VC3 entry gate (no publish)
on:
  push:
    branches: [fix/voc-trader-vision-v3-criterio-entrada-20261104]
    paths:
      - 'trader-vision/**'
      - '.github/workflows/check-voc-trader-vision-vc3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests for timing and risk management
        run: |
          set -euo pipefail
          mkdir -p /tmp/voc-vision-tests
          javac -d /tmp/voc-vision-tests \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/RiskManager.java \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/EntryTiming.java \
            trader-vision/tests/RiskManagerTest.java \
            trader-vision/tests/EntryTimingTest.java
          java -cp /tmp/voc-vision-tests pt.vcaitano.tradervision.RiskManagerTest
          java -cp /tmp/voc-vision-tests pt.vcaitano.tradervision.EntryTimingTest
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKM"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile without distributing or promoting
        run: gradle -p trader-vision clean :app:assembleDebug --stacktrace
      - name: Inspect APK structure and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=trader-vision/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='pt.vcaitano.tradervision.gestaoteste' versionCode='3' versionName='0.3.0-demo'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer.txt
          unzip -l "$APK" | grep -q classes.dex
          unzip -l "$APK" | grep -q resources.arsc
          sha256sum "$APK"
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/signer.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test -n "$SIGNER"
          if test "$SIGNER" = "3151054948a50ccb3dde9a97fd1b3bc298f544fe5742aa384d901c3bf1c01632"; then
            echo "Certificate matches V2; need private key persistence audit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: TEMPORARY DEBUG CERT DOES NOT MATCH V2. DO NOT PUBLISH THIS APK AS AN IN-PLACE UPDATE." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish is deliberately disabled until original signer recovered
        run: |
          echo "VC3: source build only; V2 catalog candidate preserved"
