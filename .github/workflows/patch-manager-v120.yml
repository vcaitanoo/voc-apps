name: Patch Manager v1.2.0

on:
  push:
    branches: [ feat/manager-v120-auto-update ]
    paths:
      - '.github/workflows/patch-manager-v120.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manager-v120-auto-update

      - name: Apply deterministic source patch
        run: python3 scripts/patch_manager_v120.py

      - name: Verify requested behavior exists
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'maybeStartAutomaticUpdate(apps)' manager/app/src/main/java/pt/vcaitano/vocmanager/MainActivity.java
          grep -q 'ACTION_INSTALL_FINISHED' manager/app/src/main/java/pt/vcaitano/vocmanager/MainActivity.java
          grep -q 'USER_ACTION_NOT_REQUIRED' manager/app/src/main/java/pt/vcaitano/vocmanager/ApkInstaller.java
          grep -q 'UPDATE_PACKAGES_WITHOUT_USER_ACTION' manager/app/src/main/AndroidManifest.xml
          git diff --check

      - name: Commit patched MainActivity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'voc Manager Build Bot'
          git config user.email '162039938+vcaitanoo@users.noreply.github.com'
          git add manager/app/src/main/java/pt/vcaitano/vocmanager/MainActivity.java
          git commit -m 'feat(manager): automatic updates and live button refresh'
          git push origin HEAD:feat/manager-v120-auto-update
