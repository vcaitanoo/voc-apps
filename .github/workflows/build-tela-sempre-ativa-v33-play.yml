name: Build Tela Sempre Ativa V33 Play Restored

on:
  push:
    paths:
      - '.github/workflows/build-tela-sempre-ativa-v33-play.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact source and V33 popup
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/tsa-v33"
          mkdir -p "$SRC" "$RUNNER_TEMP/out"
          curl -fL --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1qMKPWJ9RLcmcfAUhZVLV_GVXGusuCIAH&export=download&confirm=t' -o "$RUNNER_TEMP/base.tar.xz"
          echo '40469bae71d6667e731816cc5624f20c96031bf277f4ccb6eacae0c959d45f0f  '"$RUNNER_TEMP/base.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/base.tar.xz" -C "$SRC"
          printf '%s' '' | base64 -d | gzip -dc > "$RUNNER_TEMP/v33.patch"
          cd "$SRC"
          patch -p2 < "$RUNNER_TEMP/v33.patch"
          chmod +x gradlew
          grep -q "applicationId 'pt.vcaitano.telasempreativa'" app/build.gradle
          grep -q 'versionCode 20260901' app/build.gradle
          grep -q "versionName '1.0.28'" app/build.gradle
          grep -q 'Mantenha pressionado para abrir as ações' app/src/main/java/pt/vcaitano/telasempreativa/AodActivity.java
          grep -q 'openNotificationAfterUnlock' app/src/main/java/pt/vcaitano/telasempreativa/AodActivity.java
          grep -q 'notification-content-card' app/src/main/java/pt/vcaitano/telasempreativa/AodActivity.java
          grep -q 'android.permission.VIBRATE' app/src/main/AndroidManifest.xml
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          zip -qr "$RUNNER_TEMP/out/TelaSempreAtiva_V33_RESTAURADA_FONTE_vc20260901.zip" . -x '.gradle/*' 'app/build/*' 'build/*'

      - name: Build APK first
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Build AAB from the exact same source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign with historical key
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/tela_sempre_ativa_v1.jks"
          README="$RUNNER_TEMP/signing-readme.txt"
          curl -fL --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1TfGb0ofAVWupoDZwiAwFIdGuaGVivKWI&export=download&confirm=t' -o "$KEY"
          curl -fL --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1EIaAAdAkzu78VUtYS3cJttY_IfxDQtdN&export=download&confirm=t' -o "$README"
          echo 'c2fbe75c95dec92e3612c9a186dfa654ed0427aa9aeac2ea2caa4b1de749ab03  '"$KEY" | sha256sum -c -
          PASS="$(sed -n 's/^Senha do ficheiro: //p' "$README" | head -n1 | sed 's/[[:space:]]*$//')"
          KEYPASS="$(sed -n 's/^Senha da chave: //p' "$README" | head -n1 | sed 's/[[:space:]]*$//')"
          test -n "$PASS" && test -n "$KEYPASS"
          export PASS KEYPASS
          keytool -list -v -keystore "$KEY" -alias telaativa -storepass:env PASS > "$RUNNER_TEMP/keyinfo.txt"
          CERT="$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/keyinfo.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = 'f3e732553e25bb86bc5ca7c2aa5a0a6f9f9e798d9def964338a744f399b01d3a'
          APK_UNSIGNED="$(find "$SRC/app/build/outputs/apk/release" -type f -name '*.apk' | head -n1)"
          AAB_UNSIGNED="$(find "$SRC/app/build/outputs/bundle/release" -type f -name '*.aab' | head -n1)"
          test -s "$APK_UNSIGNED" && test -s "$AAB_UNSIGNED"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/zipalign" -p -f 4 "$APK_UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KEY" --ks-key-alias telaativa --ks-pass env:PASS --key-pass env:KEYPASS --out "$RUNNER_TEMP/out/TelaSempreAtiva_V33_RESTAURADA_v1.0.28_vc20260901.apk" "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$KEY" -storepass:env PASS -keypass:env KEYPASS -signedjar "$RUNNER_TEMP/out/TelaSempreAtiva_V33_RESTAURADA_v1.0.28_vc20260901.aab" "$AAB_UNSIGNED" telaativa

      - name: Structural validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          APK="$OUT/TelaSempreAtiva_V33_RESTAURADA_v1.0.28_vc20260901.apk"
          AAB="$OUT/TelaSempreAtiva_V33_RESTAURADA_v1.0.28_vc20260901.aab"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$OUT/apk-signature.txt"
          "$BT/aapt" dump badging "$APK" | tee "$OUT/apk-badging.txt"
          grep -q "package: name='pt.vcaitano.telasempreativa' versionCode='20260901' versionName='1.0.28'" "$OUT/apk-badging.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: f3e732553e25bb86bc5ca7c2aa5a0a6f9f9e798d9def964338a744f399b01d3a' "$OUT/apk-signature.txt"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          jarsigner -verify -verbose -certs "$AAB" > "$OUT/aab-jarsigner-verify.txt"
          grep -q 'jar verified.' "$OUT/aab-jarsigner-verify.txt"
          unzip -l "$AAB" > "$OUT/aab-contents.txt"
          grep -q 'base/manifest/AndroidManifest.xml' "$OUT/aab-contents.txt"
          grep -q 'base/dex/classes.dex' "$OUT/aab-contents.txt"
          grep -q 'base/resources.pb' "$OUT/aab-contents.txt"
          sha256sum "$APK" "$AAB" "$OUT/TelaSempreAtiva_V33_RESTAURADA_FONTE_vc20260901.zip" > "$OUT/SHA256SUMS.txt"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          AAB_SHA="$(sha256sum "$AAB" | awk '{print $1}')"
          printf '%s\n'             'TELA SEMPRE ATIVA — V33 RESTAURADA PARA GOOGLE PLAY'             'packageName: pt.vcaitano.telasempreativa'             'versionCode: 20260901'             'versionName: 1.0.28'             'certificado SHA-256: f3e732553e25bb86bc5ca7c2aa5a0a6f9f9e798d9def964338a744f399b01d3a'             "APK SHA-256: $APK_SHA"             "AAB SHA-256: $AAB_SHA"             'Base checkpoint SHA-256: 40469bae71d6667e731816cc5624f20c96031bf277f4ccb6eacae0c959d45f0f'             'Popup: pressão longa + vibração + área segura máxima + Abrir/Responder/Remover + Abrir após desbloqueio'             'Ficheiros alterados: app/build.gradle; app/src/main/AndroidManifest.xml; AodActivity.java; MediaNotificationService.java'             'Validação: compilação e estrutura verificadas; execução em Android real NÃO testada neste workflow.'             > "$OUT/VALIDACAO_V33_PLAY.txt"

      - name: Upload APK AAB source and validation
        uses: actions/upload-artifact@v4
        with:
          name: TelaSempreAtiva_V33_RESTAURADA_PLAY_vc20260901
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 14
