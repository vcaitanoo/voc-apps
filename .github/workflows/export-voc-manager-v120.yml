name: Export published voc Manager 1.2.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-voc-manager-v120.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify published APK SHA
        shell: bash
        run: |
          set -euo pipefail
          APK='apks/voc-manager/v1.2/voc-Manager-v1.2.0.apk'
          test -f "$APK"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL" = 'e927ffd0e32e1a4a303c787cfd7ecdbe72e4f56180d0a066b555fca30bc25077'
      - name: Upload exact published APK
        uses: actions/upload-artifact@v4
        with:
          name: voc-manager-v1.2.0-definitivo
          path: apks/voc-manager/v1.2/voc-Manager-v1.2.0.apk
          if-no-files-found: error
