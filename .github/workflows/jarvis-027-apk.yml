name: Jarvis 0.2.7 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_jarvis027/**'
      - '.github/workflows/jarvis-027-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Jarvis source
        shell: bash
        run: |
          set -euxo pipefail
          cat _jarvis027/source.part.00 _jarvis027/source.part.01 _jarvis027/source.part.02 _jarvis027/source.part.03 > /tmp/jarvis027.b64
          base64 -d /tmp/jarvis027.b64 > /tmp/source027.zip
          echo '579e17aea8a1444bdfee611a5d8ed7d4b67bea81a61ccc541d0ea368037753e7  /tmp/source027.zip' | sha256sum -c -
          unzip -t /tmp/source027.zip
          rm -rf jarvis027
          mkdir jarvis027
          unzip -q /tmp/source027.zip -d jarvis027
          grep -nE 'compileSdk|applicationId|targetSdk|versionCode|versionName' jarvis027/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/platforms" "$SDK/build-tools" "$SDK/licenses"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/37.0.0" >> "$GITHUB_PATH"

          curl -fL --retry 3 https://dl.google.com/android/repository/platform-37.0_r02.zip -o /tmp/platform37.zip
          rm -rf /tmp/platform37 && mkdir /tmp/platform37
          unzip -q /tmp/platform37.zip -d /tmp/platform37
          PDIR="$(find /tmp/platform37 -type f -name android.jar -printf '%h\n' | head -n1)"
          mkdir -p "$SDK/platforms/android-37"
          cp -a "$PDIR/." "$SDK/platforms/android-37/"

          for SPEC in '36.0.0 r36' '37.0.0 r37'; do
            set -- $SPEC
            VER="$1"; TAG="$2"
            rm -rf "/tmp/bt-$VER" && mkdir "/tmp/bt-$VER"
            curl -fL --retry 3 "https://dl.google.com/android/repository/build-tools_${TAG}_linux.zip" -o "/tmp/bt-$VER.zip"
            unzip -q "/tmp/bt-$VER.zip" -d "/tmp/bt-$VER"
            BDIR="$(find "/tmp/bt-$VER" -type f \( -name aapt -o -name aapt2 \) -printf '%h\n' | head -n1)"
            mkdir -p "$SDK/build-tools/$VER"
            cp -a "$BDIR/." "$SDK/build-tools/$VER/"
          done

          curl -fL --retry 3 https://dl.google.com/android/repository/platform-tools_r37.0.1-linux.zip -o /tmp/platform-tools.zip
          unzip -q /tmp/platform-tools.zip -d "$SDK"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
          printf 'sdk.dir=%s\n' "$SDK" > jarvis027/local.properties

      - name: Build APK
        working-directory: jarvis027
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp jarvis027/app/build/outputs/apk/debug/app-debug.apk out/Jarvis-0.2.7.apk
          sha256sum out/Jarvis-0.2.7.apk | tee out/Jarvis-0.2.7.sha256.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/Jarvis-0.2.7.apk | grep -E "^package:|sdkVersion|targetSdkVersion"
          ls -lh out/Jarvis-0.2.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-0.2.7
          path: |
            out/Jarvis-0.2.7.apk
            out/Jarvis-0.2.7.sha256.txt
          if-no-files-found: error
          retention-days: 7
