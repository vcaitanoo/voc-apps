name: Publish Damas v1.0.1 Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-damas-v101-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Damas artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b9c4-8211-879e-6336bb4c0a7a/raw?se=2026-08-17T09%3A42%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=96bada43-4684-5bc6-a295-5e56db9dbc5f&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T08%3A10%3A52Z&ske=2026-08-18T08%3A10%3A52Z&sks=b&skv=2026-02-06&sig=Vfhsl8j2sZkuaaqJGtCplFQYwtD5X5TDYQtxHpvYS28%3D' -o /tmp/damas-v101.zip
          rm -rf /tmp/damas-v101
          mkdir -p /tmp/damas-v101
          unzip -q /tmp/damas-v101.zip -d /tmp/damas-v101
          test -f /tmp/damas-v101/Damas-v1.0.1.apk
          test -f /tmp/damas-v101/Damas-icon.webp
          echo '7f6cd2a9b356992e9b0dcb3b5207f4a407c18d54d0f407e5727b435be7666ab3  /tmp/damas-v101/Damas-v1.0.1.apk' | sha256sum -c -
          grep -q '^versionCode=2$' /tmp/damas-v101/verification.txt
          grep -q '^versionName=1.0.1$' /tmp/damas-v101/verification.txt
          grep -q '^signatureSha256=07df7362d3a99e638d54ce97e35328b6ca415f44481198ff2f6cf47bbadb9269$' /tmp/damas-v101/verification.txt

      - name: Place APK and icon in public catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apks/damas/v1.0.1 icons
          cp /tmp/damas-v101/Damas-v1.0.1.apk apks/damas/v1.0.1/Damas-v1.0.1.apk
          cp /tmp/damas-v101/Damas-icon.webp icons/damas.webp

      - name: Update voc Manager catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          apps = data.setdefault('apps', [])
          app = next((a for a in apps if a.get('id') == 'damas'), None)
          if app is None:
              app = {'id': 'damas'}
              apps.append(app)
          app.update({
              'name': 'Damas',
              'packageName': 'pt.vcaitano.damas',
              'category': 'games',
              'description': 'Jogo de damas com adversário de IA avançado e modo online para jogar contra amigos.',
              'status': 'published',
              'versionCode': 2,
              'versionName': '1.0.1',
              'minSdk': 23,
              'apkUrl': 'https://raw.githubusercontent.com/vcaitanoo/voc-apps/main/apks/damas/v1.0.1/Damas-v1.0.1.apk',
              'sha256': '7f6cd2a9b356992e9b0dcb3b5207f4a407c18d54d0f407e5727b435be7666ab3',
              'signatureSha256': '07df7362d3a99e638d54ce97e35328b6ca415f44481198ff2f6cf47bbadb9269',
              'iconUrl': 'https://raw.githubusercontent.com/vcaitanoo/voc-apps/main/icons/damas.webp',
              'changelog': 'Damas v1.0.1 — versão de teste para validação no Android; IA Mestre preservada; multiplayer por QR/link corrigido com PeerJS/WebRTC e endereço público; nova logo aplicada.',
              'mandatory': False,
              'monetization': {
                  'type': 'free',
                  'priceCents': 0,
                  'currency': 'EUR',
                  'period': None,
                  'trialDays': 0,
                  'provider': 'none'
              }
          })
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify catalog points to exact APK
        shell: bash
        run: |
          set -euo pipefail
          sha256sum apks/damas/v1.0.1/Damas-v1.0.1.apk
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          data=json.loads(Path('manifest.json').read_text())
          app=next(a for a in data['apps'] if a['id']=='damas')
          apk=Path('apks/damas/v1.0.1/Damas-v1.0.1.apk').read_bytes()
          actual=hashlib.sha256(apk).hexdigest()
          assert app['versionCode']==2
          assert app['versionName']=='1.0.1'
          assert app['sha256']==actual=='7f6cd2a9b356992e9b0dcb3b5207f4a407c18d54d0f407e5727b435be7666ab3'
          assert app['signatureSha256']=='07df7362d3a99e638d54ce97e35328b6ca415f44481198ff2f6cf47bbadb9269'
          print('catalog verification OK')
          PY

      - name: Commit Damas v1.0.1 to voc Manager
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vcaitanoo'
          git config user.email '162039938+vcaitanoo@users.noreply.github.com'
          git add apks/damas/v1.0.1/Damas-v1.0.1.apk icons/damas.webp manifest.json
          git commit -m 'feat: publish Damas v1.0.1 test' || exit 1
          git push origin HEAD:main
