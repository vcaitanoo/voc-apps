name: Patch Manager v1.2 diagnostics

on:
  push:
    branches: [ feat/manager-v120-auto-update ]
    paths:
      - '.github/workflows/patch-manager-v120-diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manager-v120-auto-update

      - name: Apply patch
        run: python3 scripts/patch_manager_v120_diag.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Auto-update starting for' manager/app/src/main/java/pt/vcaitano/vocmanager/MainActivity.java
          grep -q 'getPackageName().equals(app.packageName)' manager/app/src/main/java/pt/vcaitano/vocmanager/MainActivity.java
          git diff --check
          git config user.name 'voc Manager Build Bot'
          git config user.email '162039938+vcaitanoo@users.noreply.github.com'
          git add manager/app/src/main/java/pt/vcaitano/vocmanager/MainActivity.java
          git commit -m 'fix(manager): protect self card and trace automatic updates'
          git push origin HEAD:feat/manager-v120-auto-update
