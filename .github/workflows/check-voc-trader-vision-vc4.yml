name: Validate VOC Trader Vision VC4 OCR and permissions (no publish)
on:
  push:
    branches:
      - fix/voc-trader-vision-vc4-real-entry-20261104
    paths:
      - 'trader-vision/**'
      - '.github/workflows/check-voc-trader-vision-vc4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure Java logic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vision-vc4-tests
          javac -d /tmp/vision-vc4-tests \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/RiskManager.java \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/EntryTiming.java \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/PanelPosition.java \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/VisualTradeVerifier.java \
            trader-vision/tests/RiskManagerTest.java \
            trader-vision/tests/EntryTimingTest.java \
            trader-vision/tests/PanelPositionTest.java \
            trader-vision/tests/VisualTradeVerifierTest.java
          for TEST in RiskManagerTest EntryTimingTest PanelPositionTest VisualTradeVerifierTest; do
            java -cp /tmp/vision-vc4-tests "pt.vcaitano.tradervision.$TEST"
          done
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKM"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug for structural validation only
        run: gradle -p trader-vision clean :app:assembleDebug --stacktrace
      - name: Verify identity and APK structure (NOT compatible signing)
        shell: bash
        run: |
          set -euo pipefail
          APK=trader-vision/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='pt.vcaitano.tradervision.gestaoteste' versionCode='4' versionName='0.4.0-demo'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer.txt
          unzip -l "$APK" | grep -q classes.dex
          unzip -l "$APK" | grep -q resources.arsc
          sha256sum "$APK"
          echo "DEBUG ONLY - DO NOT DISTRIBUTE. Permanent signing required." >> "$GITHUB_STEP_SUMMARY"
