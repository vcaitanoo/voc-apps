name: Jarvis remote diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-remote-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat _jarvis027/source.part.00 _jarvis027/source.part.01 _jarvis027/source.part.02 _jarvis027/source.part.03 > /tmp/jarvis.b64
          base64 -d /tmp/jarvis.b64 > /tmp/source.zip
          echo '579e17aea8a1444bdfee611a5d8ed7d4b67bea81a61ccc541d0ea368037753e7  /tmp/source.zip' | sha256sum -c -
          rm -rf /tmp/jarvis && mkdir /tmp/jarvis
          unzip -q /tmp/source.zip -d /tmp/jarvis
      - name: Print identity and relevant source
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BUILD IDENTITY ==='
          grep -RInE 'applicationId|versionCode|versionName|compileSdk|targetSdk' /tmp/jarvis --include='*.gradle' --include='*.kts' || true
          echo '=== RELEVANT FILES ==='
          grep -RIlE 'Fala comigo|Cadastrar minha voz|cérebro|cerebro|Começar a ouvir|Falar respostas|Tradução desligada|Traducao desligada' /tmp/jarvis --include='*.kt' --include='*.xml' --include='*.java' || true
          echo '=== RELEVANT LINES ==='
          grep -RInE -C 35 'Fala comigo|Cadastrar minha voz|cérebro|cerebro|Começar a ouvir|Falar respostas|Tradução desligada|Traducao desligada' /tmp/jarvis --include='*.kt' --include='*.xml' --include='*.java' || true
          echo '=== NETWORK / BRAIN ==='
          grep -RInE -C 25 'HttpURLConnection|https?://|brain|cérebro|cerebro|Gemini|OpenAI|Groq|apiKey|API_KEY|endpoint' /tmp/jarvis/app/src --include='*.kt' --include='*.java' --include='*.xml' || true
          echo '=== MANIFEST ==='
          cat /tmp/jarvis/app/src/main/AndroidManifest.xml || true
