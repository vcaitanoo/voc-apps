name: Backup cifrado Divulgador VC6 - staging temporario
on:
  push:
    branches: [feature/divulgador-vc6-fotos-20261121]
    paths: ['.github/workflows/stage-divulgador-vc6-cipher.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar apenas backup JA CRIPTOGRAFADO da build definitiva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/vcaitanoo/voc-apps/actions/artifacts/14687361948/zip" \
            -o "$RUNNER_TEMP/release.zip"
          unzip -p "$RUNNER_TEMP/release.zip" "Divulgador-Mobile-Assinatura-CIFRADA.cms" > "$RUNNER_TEMP/signed-backup.cms"
          test "$(wc -c < "$RUNNER_TEMP/signed-backup.cms")" -ge 1000
          # O conteudo ja foi cifrado por CMS/AES-256 para RSA-3072
          # e NAO contem o password nem a chave de recuperacao.
          openssl cms -cmsout -print -inform DER -in "$RUNNER_TEMP/signed-backup.cms" >/dev/null
          echo "BACKUP_JA_CIFRADO_VALIDADO"
      - name: Arquivar temporariamente apenas bytes cifrados
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          DIR="docs/backup-staging/DivulgadorMobileVC6"
          mkdir -p "$DIR"
          cp "$RUNNER_TEMP/signed-backup.cms" "$DIR/Divulgador-Mobile-Signing-ENCRYPTED.cms"
          sha256sum "$DIR/Divulgador-Mobile-Signing-ENCRYPTED.cms"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/Divulgador-Mobile-Signing-ENCRYPTED.cms"
          git commit -m "backup: blob CIFRADO temporario para cofre VOC"
          git push origin HEAD:main
