name: Import voc TV v0.16

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-voc-tv-v016.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated private artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-af8c-81f4-830b-b2975ee4c1a4/raw?se=2026-08-17T02%3A07%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=9415ba41-5f85-5bfb-8354-273ae029594d&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T09%3A06%3A01Z&ske=2026-08-17T09%3A06%3A01Z&sks=b&skv=2026-02-06&sig=x9ynwgaK7nJSN6VsBdSTzvFRBXyHqjbiiKq7dJreBTM%3D' \
            --output /tmp/voc-tv-v016-artifact.zip
          rm -rf /tmp/voc-v016
          mkdir -p /tmp/voc-v016
          unzip -q /tmp/voc-tv-v016-artifact.zip -d /tmp/voc-v016
          APK='/tmp/voc-v016/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          echo '1b366f6ba0337489216e09cf4d90a7942be8b5787ec79e49b3607831394e2e6c  '"$APK" | sha256sum -c -
          mkdir -p apks/voc-tv/v0.16
          cp "$APK" apks/voc-tv/v0.16/vocTV-v0.16.apk
          test "$(sha256sum apks/voc-tv/v0.16/vocTV-v0.16.apk | cut -d' ' -f1)" = '1b366f6ba0337489216e09cf4d90a7942be8b5787ec79e49b3607831394e2e6c'

      - name: Commit APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apks/voc-tv/v0.16/vocTV-v0.16.apk
          git commit -m 'release: add voc TV v0.16 APK'
          git push origin HEAD:main
