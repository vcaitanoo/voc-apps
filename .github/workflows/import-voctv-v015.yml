name: Import vocTV v0.15 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-voctv-v015.yml'

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified private build artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL='https://sdmntprnortheu.oaiusercontent.com/files/00000000-6d34-81f4-9431-7bd36fb844a6/raw?se=2026-08-16T17%3A36%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=19d76a2d-6a65-5e82-8df7-20af54cf0da1&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T08%3A33%3A28Z&ske=2026-08-17T08%3A33%3A28Z&sks=b&skv=2026-02-06&sig=t8Yf9NSFPQlKaYENoX%2BdqYM6XwpJRBRhQHFPeMFcIBY%3D'
          curl -fL --retry 4 --retry-delay 2 "$SOURCE_URL" -o /tmp/voctv-artifact.zip
          echo '7a285e968063a9d201d162bfcb397575ac100ca2a8aae4eaae5d07a5c7dbcc2b  /tmp/voctv-artifact.zip' | sha256sum -c -
          unzip -t /tmp/voctv-artifact.zip
          rm -rf /tmp/voctv-artifact
          mkdir -p /tmp/voctv-artifact
          unzip -q /tmp/voctv-artifact.zip -d /tmp/voctv-artifact
          APK='/tmp/voctv-artifact/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo '5314a2cbabfa9ac3adc255f21ff70757ed2cd1d01b06f09c88f0565d1cbbbf1f  /tmp/voctv-artifact/app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
          mkdir -p apks/voc-tv/v0.15
          cp "$APK" apks/voc-tv/v0.15/vocTV-v0.15.apk

      - name: Commit APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'voc Manager Bot'
          git config user.email '162039938+vcaitanoo@users.noreply.github.com'
          git add apks/voc-tv/v0.15/vocTV-v0.15.apk
          git commit -m 'release: voc TV v0.15 private API build'
          git push
