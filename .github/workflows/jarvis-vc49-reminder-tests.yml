name: Jarvis VC49 reminder regression tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-vc49-reminder-tests.yml'
      - 'lab/sources/jarvis/candidate/0.3.24/apply_vc49.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Recover exact published VC49 source from canonical patch chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gl/lab/sources/jarvis
          cp -a lab/sources/jarvis/candidate gl/lab/sources/jarvis/
          cd gl
          mkdir -p .vc49-test/source
          cat lab/sources/jarvis/candidate/0.2.15/source.part.* > .vc49-test/source.b64
          base64 -d .vc49-test/source.b64 > .vc49-test/source.zip
          echo '1370f787b2488ef3ccaf5c20ec88ccf2b96442c51407a308e5304fe8a9ae2f55  .vc49-test/source.zip' | sha256sum -c -
          unzip -q .vc49-test/source.zip -d .vc49-test/source
          cp lab/sources/jarvis/candidate/0.2.15/overrides/VoicePrint.kt .vc49-test/source/app/src/main/java/pt/vcaitano/jarvis/voice/VoicePrint.kt
          ln -s .vc49-test/source jarvis0215
          python3 lab/sources/jarvis/candidate/0.2.16/apply_vc18.py
          python3 lab/sources/jarvis/candidate/0.2.17/apply_vc19.py
          python3 lab/sources/jarvis/candidate/0.2.18/apply_vc20.py
          python3 lab/sources/jarvis/candidate/0.2.19/apply_vc21.py
          python3 lab/sources/jarvis/candidate/0.2.21/apply_vc22_voice_repair.py
          python3 lab/sources/jarvis/candidate/0.2.21/apply_vc23.py
          python3 lab/sources/jarvis/candidate/0.2.22/apply_vc24.py
          python3 lab/sources/jarvis/candidate/0.3.0/apply_vc25.py
          python3 lab/sources/jarvis/candidate/0.3.1/apply_vc26.py
          python3 lab/sources/jarvis/candidate/0.3.2/apply_vc27.py
          python3 lab/sources/jarvis/candidate/0.3.3/apply_vc28.py
          python3 lab/sources/jarvis/candidate/0.3.4/apply_vc29.py
          python3 lab/sources/jarvis/candidate/0.3.6/apply_vc31.py
          python3 lab/sources/jarvis/candidate/0.3.7/apply_vc32.py
          python3 lab/sources/jarvis/candidate/0.3.8/apply_vc33.py
          python3 lab/sources/jarvis/candidate/0.3.9/apply_vc34.py
          python3 lab/sources/jarvis/candidate/0.3.10/apply_vc35.py
          python3 lab/sources/jarvis/candidate/0.3.11/apply_vc36.py
          python3 lab/sources/jarvis/candidate/0.3.13/apply_vc38.py
          python3 lab/sources/jarvis/candidate/0.3.14/apply_vc39.py
          python3 lab/sources/jarvis/candidate/0.3.17/apply_vc42.py
          python3 lab/sources/jarvis/candidate/0.3.18/apply_vc43.py
          python3 lab/sources/jarvis/candidate/0.3.19/apply_vc44.py
          python3 lab/sources/jarvis/candidate/0.3.20/apply_vc45.py
          python3 lab/sources/jarvis/candidate/0.3.21/apply_vc46.py
          python3 lab/sources/jarvis/candidate/0.3.22/apply_vc47.py
          python3 lab/sources/jarvis/candidate/0.3.23/apply_vc48.py
          python3 lab/sources/jarvis/candidate/0.3.24/apply_vc49.py
      - name: Execute all JVM tests including five reminder cases
        shell: bash
        run: |
          set -euo pipefail
          cd gl/.vc49-test/source
          gradle :app:testDebugUnitTest --stacktrace --no-daemon
          echo VC49_REMINDER_TESTS_SUCCEEDED
