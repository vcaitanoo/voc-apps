name: Jarvis VC44 historical male voice recovery build

on:
  push:
    branches: [main]
    paths:
      - 'lab/sources/jarvis/candidate/0.3.19/**'
      - '.github/workflows/jarvis-vc38-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: jarvis-vc44-release
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify and publish Jarvis 0.3.19 / VC44
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JARVIS_BUILD_ENDPOINT: https://khinnoxpesnhtmmvrken.supabase.co/functions/v1/jarvis-vc38-build-oidc

    steps:
      - name: Check out GitHub source of truth
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -s lab/sources/jarvis/candidate/0.2.15/source.part.00
          test -f lab/sources/jarvis/candidate/0.3.1/vercel_build_vc26_apk.sh
          test -f lab/sources/jarvis/candidate/0.3.14/apply_vc39.py
          test -f lab/sources/jarvis/candidate/0.3.18/apply_vc43.py
          test -f lab/sources/jarvis/candidate/0.3.19/apply_vc44.py
          test -f lab/sources/jarvis/candidate/0.3.19/vercel_build_vc44_apk.sh
          mkdir -p gl/lab/sources/jarvis
          cp -a lab/sources/jarvis/candidate gl/lab/sources/jarvis/
          cp -a lab/catalog.json gl/lab/catalog.json
          cp -a manifest.json gl/manifest.json

      - name: Build, sign, verify and publish the APK
        shell: bash
        run: |
          set -euo pipefail
          cd gl
          bash lab/sources/jarvis/candidate/0.3.19/vercel_build_vc44_apk.sh
          test -s dist/Jarvis-0.3.19-vc44.apk
          test -s dist/publish.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path("dist/Jarvis-0.3.19-vc44.apk")
          report = json.loads(Path("dist/publish.json").read_text(encoding="utf-8"))
          expected = {
              "apk": "Jarvis-0.3.19-vc44.apk",
              "versionCode": 44,
              "versionName": "0.3.19",
              "apkUrl": "https://khinnoxpesnhtmmvrken.supabase.co/storage/v1/object/public/voc-lab/jarvis/candidate/Jarvis-0.3.19-vc44.apk",
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f"VC44 release report mismatch for {key}: {report.get(key)!r}")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if report.get("sha256", "").lower() != digest:
              raise SystemExit("VC44 APK SHA-256 does not match publish.json")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("VC44_LOCAL_APK_SHA256_OK=" + digest)
          PY

      - name: Register VC44 in the GitHub/VOC Lab source catalog
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          report = json.loads(Path("gl/dist/publish.json").read_text(encoding="utf-8"))
          if (report.get("versionCode"), report.get("versionName"), report.get("apk")) != (44, "0.3.19", "Jarvis-0.3.19-vc44.apk"):
              raise SystemExit("Unexpected VC44 publish metadata")
          catalog_path = Path("lab/catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          app = next((x for x in catalog["apps"] if x.get("id") == "jarvis"), None)
          if app is None:
              raise SystemExit("Jarvis app not found in lab/catalog.json")
          app["candidate"] = {
              "versionCode": 44,
              "versionName": "0.3.19",
              "apkUrl": report["apkUrl"],
              "sha256": report["sha256"].lower(),
              "signatureSha256": "f1193b9ea3123a4b1ca9938f1bf070c9ce97648f492c3f47b56a195a517138c2",
              "notes": "Recupera a voz masculina pt-BR histórica priorizando Samsung TTS e alterna para Google/Android apenas quando identifica uma voz masculina. Adiciona prazo de inicialização e recuperação do mecanismo de voz; nunca sintetiza com voz feminina ou sem identificação masculina. APK assinado e SHA-256 verificados; teste físico pendente."
          }
          catalog["updatedAt"] = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/catalog.json
          if git diff --cached --quiet; then
            echo "VC44 catalog already registered."
          else
            git commit -m "Publish Jarvis VC44 numbered reminders candidate"
            git push origin HEAD:main
          fi

      - name: Sync the live VOC Lab catalog in Supabase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("gl/dist/publish.json").read_text(encoding="utf-8"))
          if (report.get("versionCode"), report.get("versionName")) != (44, "0.3.19"):
              raise SystemExit("The published APK is not VC44")
          if not report.get("apkUrl", "").endswith("Jarvis-0.3.19-vc44.apk"):
              raise SystemExit("Unexpected published APK URL")
          if len(report.get("sha256", "")) != 64:
              raise SystemExit("Invalid APK SHA-256")
          PY
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fkhinnoxpesnhtmmvrken.supabase.co%2Ffunctions%2Fv1%2Fjarvis-vc38-build-oidc"
          VERCEL_OIDC_TOKEN="$(curl --connect-timeout 15 --max-time 30 -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          HTTP_CODE="$(curl --connect-timeout 15 --max-time 30 -sS -w '%{http_code}' -o "$RUNNER_TEMP/voc-lab-catalog-sync.json" -X POST -H "Authorization: Bearer ${VERCEL_OIDC_TOKEN}" -H "x-action: publish-catalog" -H "Content-Type: application/json" --data-binary @gl/dist/publish.json "$JARVIS_BUILD_ENDPOINT")"
          cat "$RUNNER_TEMP/voc-lab-catalog-sync.json"
          test "$HTTP_CODE" = "200"
          python3 - "$RUNNER_TEMP/voc-lab-catalog-sync.json" <<'PY'
          import json, sys
          result = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if not result.get("ok") or result.get("versionCode") != 44 or result.get("versionName") != "0.3.19":
              raise SystemExit("Live VOC Lab catalog did not confirm VC44")
          print("LIVE_VOC_LAB_CATALOG_VC44_OK")
          PY

      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-vc44-build-evidence
          path: |
            gl/dist/**
          if-no-files-found: warn
          retention-days: 7
