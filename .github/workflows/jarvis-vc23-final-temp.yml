name: Temporary Jarvis VC23 final build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-vc23-final-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct official VC23 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch fix/jarvis-vc23-audio https://gitlab.com/oliveira.caitano2023/voc-lab.git official
          cd official
          cat lab/sources/jarvis/candidate/0.2.15/source.part.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          echo '1370f787b2488ef3ccaf5c20ec88ccf2b96442c51407a308e5304fe8a9ae2f55  /tmp/source.zip' | sha256sum -c -
          rm -rf jarvis0215 && mkdir jarvis0215
          unzip -q /tmp/source.zip -d jarvis0215
          cp lab/sources/jarvis/candidate/0.2.15/overrides/VoicePrint.kt jarvis0215/app/src/main/java/pt/vcaitano/jarvis/voice/VoicePrint.kt
          python3 lab/sources/jarvis/candidate/0.2.16/apply_vc18.py
          python3 lab/sources/jarvis/candidate/0.2.17/apply_vc19.py
          python3 lab/sources/jarvis/candidate/0.2.18/apply_vc20.py
          python3 lab/sources/jarvis/candidate/0.2.19/apply_vc21.py
          python3 lab/sources/jarvis/candidate/0.2.20/apply_vc22.py
          python3 lab/sources/jarvis/candidate/0.2.21/apply_vc23.py
          grep -q 'versionCode = 23' jarvis0215/app/build.gradle.kts
          grep -q 'versionName = "0.2.21"' jarvis0215/app/build.gradle.kts
          grep -q 'restoreRecognitionTones(force: Boolean = false)' jarvis0215/app/src/main/java/pt/vcaitano/jarvis/voice/VoiceController.kt
          grep -q 'VC23: local TTS only' jarvis0215/app/src/main/java/pt/vcaitano/jarvis/voice/VoiceController.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/platforms" "$SDK/build-tools" "$SDK/licenses"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/37.0.0" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://dl.google.com/android/repository/platform-37.0_r02.zip -o /tmp/platform37.zip
          rm -rf /tmp/platform37 && mkdir /tmp/platform37
          unzip -q /tmp/platform37.zip -d /tmp/platform37
          PDIR="$(find /tmp/platform37 -type f -name android.jar -printf '%h\n' | head -n1)"
          mkdir -p "$SDK/platforms/android-37"
          cp -a "$PDIR/." "$SDK/platforms/android-37/"
          curl -fL --retry 3 https://dl.google.com/android/repository/build-tools_r37_linux.zip -o /tmp/bt37.zip
          rm -rf /tmp/bt37 && mkdir /tmp/bt37
          unzip -q /tmp/bt37.zip -d /tmp/bt37
          BDIR="$(find /tmp/bt37 -type f \( -name aapt -o -name aapt2 \) -printf '%h\n' | head -n1)"
          mkdir -p "$SDK/build-tools/37.0.0"
          cp -a "$BDIR/." "$SDK/build-tools/37.0.0/"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
          printf 'sdk.dir=%s\n' "$SDK" > official/jarvis0215/local.properties

      - name: Build, sign, validate and publish
        shell: bash
        run: |
          set -euxo pipefail
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jarvis-vc23-signing"
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | jq -r .value)"
          curl -fsSL -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H 'x-action: signing' 'https://khinnoxpesnhtmmvrken.supabase.co/functions/v1/jarvis-vc23-signing-oidc-temp' -o /tmp/signing.json
          jq -r .keystoreB64 /tmp/signing.json | base64 -d > /tmp/jarvis-release.jks
          export JARVIS_STORE_PASSWORD="$(jq -r .password /tmp/signing.json)"
          export JARVIS_KEY_PASSWORD="$JARVIS_STORE_PASSWORD"
          export JARVIS_KEY_ALIAS="$(jq -r .alias /tmp/signing.json)"
          export JARVIS_KEYSTORE_PATH=/tmp/jarvis-release.jks
          rm -f /tmp/signing.json
          echo '0f642fb4658dd2b3989b2208aeb88479e9bd5a35dca913d6da9cee3e8079a9bc  /tmp/jarvis-release.jks' | sha256sum -c -
          cd official/jarvis0215
          gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          mkdir -p out
          cp official/jarvis0215/app/build/outputs/apk/release/app-release.apk out/Jarvis-0.2.21-vc23.apk
          sha256sum out/Jarvis-0.2.21-vc23.apk | tee out/sha256.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/Jarvis-0.2.21-vc23.apk | grep -E '^package:|sdkVersion|targetSdkVersion' | tee out/badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs out/Jarvis-0.2.21-vc23.apk | tee out/apksigner.txt
          grep -q "name='pt.vcaitano.jarvis' versionCode='23' versionName='0.2.21'" out/badging.txt
          grep -qi 'f1193b9ea3123a4b1ca9938f1bf070c9ce97648f492c3f47b56a195a517138c2' out/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/apksigner.txt
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | jq -r .value)"
          curl -fsSL -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H 'x-action: upload' -H 'Content-Type: application/vnd.android.package-archive' --data-binary @out/Jarvis-0.2.21-vc23.apk 'https://khinnoxpesnhtmmvrken.supabase.co/functions/v1/jarvis-vc23-signing-oidc-temp' | tee out/upload.json
          grep -q '"ok":true' out/upload.json
          rm -f /tmp/jarvis-release.jks

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-0.2.21-vc23
          path: out/
          if-no-files-found: error
          retention-days: 2

