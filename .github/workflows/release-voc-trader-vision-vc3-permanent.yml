name: Release VOC Trader Vision VC3 permanent signer (one-time migration)

on:
  push:
    branches: [release/voc-trader-vision-vc3-permanent-key-20261104]
    paths:
      - '.github/workflows/release-voc-trader-vision-vc3-permanent.yml'

permissions:
  contents: write

jobs:
  sign-backup-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: voc-trader-vision-permanent-signing-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test risk, entry and panel logic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/voc-trader-tests
          javac -d /tmp/voc-trader-tests \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/RiskManager.java \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/EntryTiming.java \
            trader-vision/app/src/main/java/pt/vcaitano/tradervision/PanelPosition.java \
            trader-vision/tests/RiskManagerTest.java \
            trader-vision/tests/EntryTimingTest.java \
            trader-vision/tests/PanelPositionTest.java
          java -cp /tmp/voc-trader-tests pt.vcaitano.tradervision.RiskManagerTest
          java -cp /tmp/voc-trader-tests pt.vcaitano.tradervision.EntryTimingTest
          java -cp /tmp/voc-trader-tests pt.vcaitano.tradervision.PanelPositionTest
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKM"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate one permanent signing key, build signed release, encrypt backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          STORE="$RUNNER_TEMP/voc-trader-permanent-vc3.p12"
          PASSFILE="$RUNNER_TEMP/voc-trader-permanent-pass.txt"
          trap 'rm -f "$STORE" "$PASSFILE"' EXIT
          openssl rand -base64 36 | tr -d '\n' > "$PASSFILE"
          PASS="$(cat "$PASSFILE")"
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt -alias voc-trader-release \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=VOC Trader Vision, OU=VOC Lab, O=VCaitano, L=Lousada, ST=Porto, C=PT" \
            -storetype PKCS12 -keystore "$STORE" -storepass "$PASS" -keypass "$PASS"
          export VOC_TRADER_KEYSTORE_FILE="$STORE"
          export VOC_TRADER_STORE_PASS="$PASS"
          export VOC_TRADER_KEY_PASS="$PASS"
          gradle -p trader-vision clean :app:assembleRelease --stacktrace
          APK=trader-vision/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/voc-trader-vc3-badging.txt
          grep -q "package: name='pt.vcaitano.tradervision.gestaoteste' versionCode='3' versionName='0.3.0-demo'" /tmp/voc-trader-vc3-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/voc-trader-vc3-signature.txt
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          sha256sum "$APK" | tee /tmp/voc-trader-vc3-sha256.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/voc-trader-vc3-signature.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT"
          echo "PUBLIC SIGNER SHA256=$CERT" >> "$GITHUB_STEP_SUMMARY"
          python3 -m pip install --user --quiet 'cryptography>=42,<47'
          export KEYFILE="$STORE"
          export PASSFILE="$PASSFILE"
          export PUBLIC_SIGNER="$CERT"
          python3 - <<'PY'
          import os, json, base64
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          path='trader-vision/security/recovery-public.pem'
          public=serialization.load_pem_public_key(open(path,'rb').read())
          payload={
            'packageName':'pt.vcaitano.tradervision.gestaoteste',
            'versionCode':3,'keyAlias':'voc-trader-release',
            'certificateSha256':os.environ['PUBLIC_SIGNER'],
            'keystorePkcs12Base64':base64.b64encode(open(os.environ['KEYFILE'],'rb').read()).decode(),
            'keystorePassword':open(os.environ['PASSFILE']).read(),
            'keyPassword':open(os.environ['PASSFILE']).read()
          }
          plaintext=json.dumps(payload,separators=(',',':')).encode()
          key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=b'VOC-TRADER-VISION-SIGNING-V1'
          cipher=AESGCM(key).encrypt(nonce,plaintext,aad)
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),
                                                     algorithm=hashes.SHA256(),label=None))
          out={
            'schemaVersion':1,
            'algorithm':'RSA-OAEP-SHA256+AES-256-GCM',
            'aad':aad.decode(),
            'encryptedKey':base64.b64encode(wrapped).decode(),
            'nonce':base64.b64encode(nonce).decode(),
            'ciphertext':base64.b64encode(cipher).decode(),
            'certificateSha256':payload['certificateSha256'],
            'packageName':payload['packageName'],
            'keyAlias':payload['keyAlias'],
            'sourceCommit':os.environ['GITHUB_SHA']
          }
          dest='trader-vision/security/voc-trader-signing-vc3.encrypted.json'
          with open(dest,'w',encoding='utf-8') as f:json.dump(out,f,indent=2);f.write('\n')
          # No plaintext signing material is copied into source or artifacts.
          check=AESGCM(key).decrypt(nonce,cipher,aad)
          assert check==plaintext
          print('Encrypted signer backup self-test: OK')
          PY
      - name: Publish signed APK and encrypted backup to temporary Git mirror
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://github.com/vcaitanoo/voc-apps.git" /tmp/main-checkout
        env:
          GIT_TERMINAL_PROMPT: '0'
      - name: Checkout main using GitHub credentials for publishing
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish-main
          fetch-depth: 0
      - name: Publish candidate without changing stable identity or app count
        shell: bash
        run: |
          set -euo pipefail
          APK=trader-vision/app/build/outputs/apk/release/app-release.apk
          DEST=apks/voc-trader-vision-gestao-teste/candidate/VOC-Trader-Vision-0.3.0-demo-VC3.apk
          BACKUP=trader-vision/security/voc-trader-signing-vc3.encrypted.json
          mkdir -p "publish-main/$(dirname "$DEST")" "publish-main/$(dirname "$BACKUP")"
          cp "$APK" "publish-main/$DEST"
          cp "$BACKUP" "publish-main/$BACKUP"
          export TV_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          export TV_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/voc-trader-vc3-signature.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          export TV_PATH="$DEST"
          python3 - <<'PY'
          import os,json,datetime
          path='publish-main/lab/catalog.json'
          with open(path,encoding='utf-8') as f:catalog=json.load(f)
          apps=catalog['apps']
          candidates=[a for a in apps if a.get('id')=='voc-trader-vision-gestao-teste']
          assert len(candidates)==1
          app=candidates[0]
          assert app['packageName']=='pt.vcaitano.tradervision.gestaoteste'
          assert app['candidate']['versionCode']==2
          assert app['candidate']['signatureSha256']=='3151054948a50ccb3dde9a97fd1b3bc298f544fe5742aa384d901c3bf1c01632'
          assert app['stable']['versionCode']==0
          app['candidate']={
            'versionCode':3,'versionName':'0.3.0-demo',
            'apkUrl':'https://raw.githubusercontent.com/vcaitanoo/voc-apps/main/'+os.environ['TV_PATH'],
            'sha256':os.environ['TV_SHA'],'signatureSha256':os.environ['TV_CERT'],
            'notes':'VC3 DEMO: painel arrastável, confirmação visual de sinal sem janela de 10 segundos, cooldown de entradas e gestão mantida. UMA SÓ APP e MESMO package. ASSINATURA MIGRADA: desinstale a VC2 uma única vez antes de instalar a VC3; configurações locais antigas podem perder-se. Keystore permanente cifrada com RSA-OAEP+AES-GCM, recuperação documentada no voc-cofre. Assinatura não é compatível com a VC2, futuras versões devem reutilizar EXATAMENTE a chave permanente VC3. Build, manifesto, DEX, hash e assinatura verificados; execução no Android real ainda não testada.'
          }
          assert len([a for a in apps if 'trader-vision' in a['id']])==1
          assert all(isinstance(a.get('stable'),dict) for a in apps)
          catalog['updatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          with open(path,'w',encoding='utf-8') as f:json.dump(catalog,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
          git -C publish-main config user.name "github-actions[bot]"
          git -C publish-main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish-main add "$DEST" "$BACKUP" lab/catalog.json
          git -C publish-main diff --cached --check
          git -C publish-main commit -m "candidate(trader-vision): migrate single VC3 app to permanent signed release"
          git -C publish-main push origin HEAD:main
          echo "APK SHA256=$TV_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "CERT SHA256=$TV_CERT" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published URL contents and signer
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/vcaitanoo/voc-apps/main/apks/voc-trader-vision-gestao-teste/candidate/VOC-Trader-Vision-0.3.0-demo-VC3.apk"
          curl -fLSs --retry 6 --retry-delay 2 "$URL" -o /tmp/voc-remote-vc3.apk
          cmp /tmp/voc-remote-vc3.apk trader-vision/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/voc-remote-vc3.apk > /tmp/remote-vc3-certs.txt
          diff -u <(grep 'Signer #1 certificate SHA-256 digest' /tmp/voc-trader-vc3-signature.txt) <(grep 'Signer #1 certificate SHA-256 digest' /tmp/remote-vc3-certs.txt)
          sha256sum /tmp/voc-remote-vc3.apk
          echo "APK URL SHA and signature verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Store public verification report only
        uses: actions/upload-artifact@v4
        with:
          name: VOC-Trader-Vision-VC3-Permanent-Signer-Verification
          if-no-files-found: error
          path: |
            /tmp/voc-trader-vc3-badging.txt
            /tmp/voc-trader-vc3-signature.txt
            /tmp/voc-trader-vc3-sha256.txt
