name: Verify voc Manager 1.2.1 release

on:
  pull_request_target:
    paths:
      - 'delivery/voc-manager-v121-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_MANAGER_SIGNER_SHA256: 918b566590b49f691ec9880c95dd174a6c032b21f81dc66efcfac74d0de11aa8
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VOC_MANAGER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VOC_MANAGER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VOC_MANAGER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/voc-manager-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "VOC_MANAGER_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          VOC_MANAGER_STORE_PASSWORD: ${{ secrets.VOC_MANAGER_KEYSTORE_PASSWORD }}
          VOC_MANAGER_KEY_ALIAS: voc-manager-release
          VOC_MANAGER_KEY_PASSWORD: ${{ secrets.VOC_MANAGER_KEYSTORE_PASSWORD }}
        run: gradle -p manager clean testDebugUnitTest assembleRelease --stacktrace

      - name: Verify signed APK structure and signer
        shell: bash
        run: |
          set -euo pipefail
          APK="manager/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee manager-release-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee manager-release-signature.txt
          sha256sum "$APK" | tee manager-release-sha256.txt
          grep -q "package: name='pt.vcaitano.vocmanager' versionCode='5' versionName='1.2.1'" manager-release-badging.txt
          grep -q "application-label:'voc Manager'" manager-release-badging.txt
          ACTUAL_SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' manager-release-signature.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_SIGNER" = "$EXPECTED_MANAGER_SIGNER_SHA256"

      - name: Install emulator image
        run: |
          set -u
          for attempt in 1 2 3; do
            if sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"; then exit 0; fi
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/system-images/android-35/google_apis/x86_64" "$HOME/.android/cache" || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Verify manual update behavior on emulator
        shell: bash
        run: |
          set -euo pipefail
          APK="manager/app/build/outputs/apk/release/app-release.apk"
          OLD_TV="apks/voc-tv/v0.17/vocTV-v0.17.apk"
          test -s "$OLD_TV"

          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd -n voc_manager_release_test -k "system-images;android-35;google_apis;x86_64" -p "$ANDROID_AVD_HOME/voc_manager_release_test.avd" --force
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          if [ -e /dev/kvm ]; then ACCEL_ARGS="-accel on"; else ACCEL_ARGS="-accel off"; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd voc_manager_release_test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect $ACCEL_ARGS > emulator.log 2>&1 &
          EMULATOR_PID=$!

          READY=0
          for i in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat emulator.log; exit 1; fi
            if adb devices | grep -q '^emulator-.*device$' && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = "1"

          adb install -r "$APK" | tee manager-install.txt
          grep -q "Success" manager-install.txt
          adb install -r -i pt.vcaitano.vocmanager "$OLD_TV" | tee old-tv-install.txt
          grep -q "Success" old-tv-install.txt
          adb shell appops set pt.vcaitano.vocmanager REQUEST_INSTALL_PACKAGES allow

          BEFORE="$(adb shell dumpsys package pt.vcaitano.iptvia | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
          test "$BEFORE" = "17"

          adb logcat -c
          adb shell am start -n pt.vcaitano.vocmanager/.MainActivity | tee manager-start.txt
          sleep 12

          STILL_OLD="$(adb shell dumpsys package pt.vcaitano.iptvia | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
          echo "version_after_open_without_click=$STILL_OLD" | tee no-auto-update-result.txt
          test "$STILL_OLD" = "17"

          adb shell uiautomator dump /sdcard/manager-before.xml >/dev/null 2>&1
          adb pull /sdcard/manager-before.xml manager-ui-before.xml >/dev/null 2>&1
          grep -q "ATUALIZAÇÃO DISPONÍVEL" manager-ui-before.xml
          grep -q "ATUALIZAR PARA 0.18.0" manager-ui-before.xml

          read TAP_X TAP_Y < <(python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('manager-ui-before.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'ATUALIZAR PARA 0.18.0':
                  m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if not m:
                      raise SystemExit('button bounds not found')
                  x1, y1, x2, y2 = map(int, m.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          else:
              raise SystemExit('update button not found')
          PY
          )
          adb shell input tap "$TAP_X" "$TAP_Y"

          UPDATED=0
          for i in $(seq 1 90); do
            CURRENT="$(adb shell dumpsys package pt.vcaitano.iptvia | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
            if [ "$CURRENT" = "18" ]; then UPDATED=1; break; fi
            sleep 1
          done
          echo "manual_update_result=$UPDATED" | tee manual-update-result.txt
          test "$UPDATED" = "1"

          adb logcat -d -t 4000 > manager-logcat.txt || true
          if grep -q "FATAL EXCEPTION" manager-logcat.txt; then
            grep -A40 -B10 "FATAL EXCEPTION" manager-logcat.txt
            exit 1
          fi

      - name: Upload signed APK and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voc-manager-v1.2.1-release-evidence
          path: |
            manager/app/build/outputs/apk/release/app-release.apk
            manager-release-badging.txt
            manager-release-signature.txt
            manager-release-sha256.txt
            manager-install.txt
            old-tv-install.txt
            manager-start.txt
            manager-ui-before.xml
            no-auto-update-result.txt
            manual-update-result.txt
            manager-logcat.txt
            emulator.log
          if-no-files-found: warn
