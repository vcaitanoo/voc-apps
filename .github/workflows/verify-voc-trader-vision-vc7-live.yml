name: Verify VOC Trader Vision VC7 live catalog and single app
on:
  push:
    branches: [fix/voc-trader-vision-vc7-signal-clock-20261105]
    paths: ['.github/workflows/verify-voc-trader-vision-vc7-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify primary VOC Lab catalog and published VC7 URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://temporary-snappy-redwood-yqm3s0d.vercel.app/catalog.json'
          curl -fsSL --retry 5 --retry-delay 3 --max-time 30 "$URL" -o /tmp/catalog-vc7.json
          python3 - <<'PY'
          import json
          cat=json.load(open('/tmp/catalog-vc7.json',encoding='utf-8'))
          apps=cat['apps']
          trader=[a for a in apps if 'trader' in a.get('id','').lower()]
          assert len(trader)==1, f'Expected one Trader: {len(trader)}'
          a=trader[0]
          assert a['id']=='voc-trader-vision-gestao-teste'
          assert a['packageName']=='pt.vcaitano.tradervision.gestaoteste'
          c=a['candidate']
          assert c['versionCode']==7 and c['versionName']=='0.7.0-demo'
          assert c['signatureSha256']=='e52d1c13baa3a4e7f73b71cb7e15bc1fdd8709650aa64fe8a9b86bb26a5491f9'
          assert c['sha256']=='a6210df7b93e3658de4314618fa1791e5eeeee757d4b0e06d48e13d8c7279ba3'
          assert a['stable']['versionCode']==0
          print('VOC Lab original live endpoint: one and only one Trader Vision VC7')
          print('App count:',len(apps),'signature preserved')
          PY
          curl -fsSL --retry 5 --retry-delay 2 --max-time 180 \
            'https://raw.githubusercontent.com/vcaitanoo/voc-apps/main/apks/voc-trader-vision-gestao-teste/candidate/VOC-Trader-Vision-0.7.0-demo-VC7.apk' \
            -o /tmp/remote-vc7.apk
          echo 'a6210df7b93e3658de4314618fa1791e5eeeee757d4b0e06d48e13d8c7279ba3  /tmp/remote-vc7.apk' | sha256sum -c -
          echo 'LIVE primary VOC Lab endpoint and VC7 APK SHA256 confirmed.' >> "$GITHUB_STEP_SUMMARY"
