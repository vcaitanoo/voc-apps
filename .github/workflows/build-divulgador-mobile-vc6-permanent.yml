CERTIFICATE
          openssl x509 -in "$RUNNER_TEMP/recovery-public.crt" -noout >/dev/null
      - name: Gerar assinatura PERMANENTE unica e backup sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$PASS"
          KEYSTORE="$RUNNER_TEMP/divulgador-mobile-signing.p12"
          ALIAS="divulgador-mobile-release"
          keytool -genkeypair -storetype PKCS12 -keystore "$KEYSTORE" \
            -alias "$ALIAS" -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -validity 36500 -dname "CN=Divulgador Mobile, OU=VOC, O=VOC, C=PT" \
            -storepass "$PASS" -keypass "$PASS" -noprompt >/dev/null
          chmod 600 "$KEYSTORE"
          printf '%s' "$PASS" > "$RUNNER_TEMP/signing-password.txt"
          chmod 600 "$RUNNER_TEMP/signing-password.txt"
          # O pacote de recuperação só pode ser aberto com a chave privada
          # de recuperação externa; esse segredo NUNCA entra no GitHub.
          tar -cf "$RUNNER_TEMP/signing-private.tar" \
            -C "$RUNNER_TEMP" divulgador-mobile-signing.p12 signing-password.txt
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$RUNNER_TEMP/signing-private.tar" \
            -out "$RUNNER_TEMP/Divulgador-Mobile-Assinatura-CIFRADA.cms" \
            -outform DER "$RUNNER_TEMP/recovery-public.crt"
          test -s "$RUNNER_TEMP/Divulgador-Mobile-Assinatura-CIFRADA.cms"
          echo "DIVULGADOR_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DIVULGADOR_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "DIVULGADOR_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "DIVULGADOR_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          # Informação pública do certificado para continuidade.
          keytool -exportcert -rfc -keystore "$KEYSTORE" -alias "$ALIAS" \
            -storepass "$PASS" > "$RUNNER_TEMP/Divulgador-Mobile-Certificado-ASSINATURA.crt"
      - name: Compilar release a partir do mesmo codigo fonte Gradle
        run: gradle -p "$ROOT" --no-daemon :app:assembleRelease
      - name: Validar APK e gravar hash publico da assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK="$ROOT/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -qx classes.dex
          unzip -Z1 "$APK" | grep -qx AndroidManifest.xml
          unzip -Z1 "$APK" | grep -qx resources.arsc
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='pt.vcaitano.divulgadormobile' versionCode='6' versionName='0.1.5'" "$RUNNER_TEMP/badging.txt"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/assinatura.txt"
          grep -qx Verifies "$RUNNER_TEMP/assinatura.txt"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/assinatura.txt" | head -1 | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT" =~ ^[a-f0-9]{64}$ ]]
          sha256sum "$APK" > "$RUNNER_TEMP/apk-sha256.txt"
          cp "$APK" "$RUNNER_TEMP/Divulgador-Mobile-0.1.5-vc6-release.apk"
          cat "$RUNNER_TEMP/apk-sha256.txt"
          printf 'CERTIFICATE_SHA256=%s\n' "$CERT"
          echo "ASSINATURA DEFINITIVA: somente reutilizar este keystore para futuros APKs."
      - name: Disponibilizar APK e backup criptografado, sem expor chaves
        uses: actions/upload-artifact@v4
        with:
          name: Divulgador-Mobile-VC6-RELEASE-e-Backup-Cifrado
          path: |
            ${{ runner.temp }}/Divulgador-Mobile-0.1.5-vc6-release.apk
            ${{ runner.temp }}/Divulgador-Mobile-Assinatura-CIFRADA.cms
            ${{ runner.temp }}/Divulgador-Mobile-Certificado-ASSINATURA.crt
            ${{ runner.temp }}/apk-sha256.txt
            ${{ runner.temp }}/badging.txt
            ${{ runner.temp }}/assinatura.txt
          retention-days: 90
