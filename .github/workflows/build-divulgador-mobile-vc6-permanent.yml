name: Divulgador Mobile VC6 - build release assinado e backup criptografado
on:
  push:
    branches: [feature/divulgador-vc6-fotos-20261121]
    paths:
      - '.github/workflows/build-divulgador-mobile-vc6-permanent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROOT: lab/sources/divulgador/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testes CSV e regras de fotos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/csv-tests"
          javac -d "$RUNNER_TEMP/csv-tests" "$ROOT/app/src/main/java/pt/vcaitano/divulgador/CsvFormat.java" "$ROOT/csv-tests/CsvFormatTest.java"
          java -cp "$RUNNER_TEMP/csv-tests" pt.vcaitano.divulgador.CsvFormatTest
          python3 - <<'PY'
          from pathlib import Path
          base=Path("lab/sources/divulgador/android/app/src/main")
          java=base/"java/pt/vcaitano/divulgador"
          send=(java/"SendActivity.java").read_text()
          photo=(java/"PhotoAttachments.java").read_text()
          gen=(java/"GeneratorActivity.java").read_text()
          manifest=(base/"AndroidManifest.xml").read_text()
          gradle=Path("lab/sources/divulgador/android/app/build.gradle.kts").read_text()
          assert "USAR NO DIVULGADOR" in gen
          assert "IMPORTAR CSV E CONFIGURAR" in (java/"MainActivity.kt").read_text()
          assert "CsvFormat.parse(csv)" in send
          assert "ACTION_SEND_MULTIPLE" in send
          assert "ACTION_SENDTO" in send
          assert "ACTION_OPEN_DOCUMENT" in photo and "EXTRA_ALLOW_MULTIPLE" in photo
          assert "FileProvider.getUriForFile" in photo
          assert "FLAG_GRANT_READ_URI_PERMISSION" in photo
          assert 'android:resource="@xml/email_photo_paths"' in manifest
          assert 'applicationId = "pt.vcaitano.divulgadormobile"' in gradle
          assert '?: "6").toInt()' in gradle and '?: "0.1.5"' in gradle
          print("PASSOU: integracao CSV, galeria/fotos, anexo e manifest/versao")
          PY
      - name: Preparar certificado PUBLICO de backup
        shell: bash
        run: |
