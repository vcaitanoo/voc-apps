name: Import voc TV v0.14 APK

on:
  push:
    paths:
      - '.github/workflows/import-voc-tv-v014.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated v0.14 artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprnortheu.oaiusercontent.com/files/00000000-d424-81f4-980e-442bf95c4d04/raw?se=2026-08-16T15%3A44%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=0b961f5b-3b7e-55e3-9292-9d913c7bad80&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T22%3A22%3A36Z&ske=2026-08-16T22%3A22%3A36Z&sks=b&skv=2026-02-06&sig=hJUs/MdAk7J3UUE0CiuYf%2BTqPHsY9SaVx1tpU6ymVfs%3D'
          curl --fail --location --retry 3 "$URL" -o /tmp/v014-artifact.zip
          echo 'dcbd94dd61b076c942ea3848b038cf5b581de2dd19e84def0a938681d4163bab  /tmp/v014-artifact.zip' | sha256sum -c -
          rm -rf /tmp/v014-artifact
          mkdir -p /tmp/v014-artifact
          unzip -q /tmp/v014-artifact.zip -d /tmp/v014-artifact
          APK="$(find /tmp/v014-artifact -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          echo '08f8e1cc09ec959dcfb59b1f4187bf766cd2c4cd3f50775d4ea2a1f4b76c75cf  '"$APK" | sha256sum -c -
          mkdir -p apks/voc-tv/v0.14
          cp "$APK" apks/voc-tv/v0.14/vocTV-v0.14.apk
          echo '08f8e1cc09ec959dcfb59b1f4187bf766cd2c4cd3f50775d4ea2a1f4b76c75cf  apks/voc-tv/v0.14/vocTV-v0.14.apk' | sha256sum -c -

      - name: Commit APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apks/voc-tv/v0.14/vocTV-v0.14.apk
          git commit -m 'release(voc-tv): publish v0.14 APK'
          git push
