name: Jarvis VC41 male Brazilian voice build

on:
  push:
    branches: [main]
    paths:
      - 'lab/sources/jarvis/candidate/0.3.16/**'
      - '.github/workflows/jarvis-vc41-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: jarvis-vc41-release
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and publish Jarvis 0.3.16 / VC41
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JARVIS_BUILD_ENDPOINT: https://khinnoxpesnhtmmvrken.supabase.co/functions/v1/jarvis-vc38-build-oidc

    steps:
      - name: Check out GitHub source of truth
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -s lab/sources/jarvis/candidate/0.2.15/source.part.00
          test -f lab/sources/jarvis/candidate/0.3.1/vercel_build_vc26_apk.sh
          test -f lab/sources/jarvis/candidate/0.3.14/apply_vc39.py
          test -f lab/sources/jarvis/candidate/0.3.16/apply_vc41.py
          test -f lab/sources/jarvis/candidate/0.3.16/vercel_build_vc41_apk.sh
          mkdir -p gl/lab/sources/jarvis
          cp -a lab/sources/jarvis/candidate gl/lab/sources/jarvis/
          cp -a lab/catalog.json gl/lab/catalog.json
          cp -a manifest.json gl/manifest.json

      - name: Build, sign, verify and publish the APK
        shell: bash
        run: |
          set -euo pipefail
          cd gl
          bash lab/sources/jarvis/candidate/0.3.16/vercel_build_vc41_apk.sh
          test -s dist/Jarvis-0.3.16-vc41.apk
          test -s dist/publish.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path("dist/Jarvis-0.3.16-vc41.apk")
          report = json.loads(Path("dist/publish.json").read_text(encoding="utf-8"))
          expected = {
              "apk": "Jarvis-0.3.16-vc41.apk",
              "versionCode": 41,
              "versionName": "0.3.16",
              "apkUrl": "https://khinnoxpesnhtmmvrken.supabase.co/storage/v1/object/public/voc-lab/jarvis/candidate/Jarvis-0.3.16-vc41.apk",
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f"VC41 release report mismatch for {key}: {report.get(key)!r}")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if report.get("sha256", "").lower() != digest:
              raise SystemExit("VC41 APK SHA-256 does not match publish.json")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("VC41_LOCAL_APK_SHA256_OK=" + digest)
          PY

      - name: Register VC41 in the GitLab/VOC Lab source catalog
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
            import json
            from datetime import datetime, timezone
            from pathlib import Path
            report = json.loads(Path("gl/dist/publish.json").read_text(encoding="utf-8"))
            if (report.get("versionCode"), report.get("versionName"), report.get("apk")) != (41, "0.3.16", "Jarvis-0.3.16-vc41.apk"):
                raise SystemExit("Unexpected VC41 publish metadata")
            catalog_path = Path("lab/catalog.json")
            catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
            app = next((x for x in catalog["apps"] if x.get("id") == "jarvis"), None)
            if app is None:
                raise SystemExit("Jarvis app not found in lab/catalog.json")
            app["candidate"] = {
                "versionCode": 41,
                "versionName": "0.3.16",
                "apkUrl": report["apkUrl"],
                "sha256": report["sha256"].lower(),
                "signatureSha256": "f1193b9ea3123a4b1ca9938f1bf070c9ce97648f492c3f47b56a195a517138c2",
                "notes": "Correção focada na voz: exige voz masculina identificada em português do Brasil (pt-BR), sem fallback para voz feminina/genérica, e remove avisos de falha de síntese. APK assinado; teste físico pendente."
            }
            catalog["updatedAt"] = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
            catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
            PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lab/catalog.json
            if git diff --cached --quiet; then
              echo "VC41 catalog already registered."
              exit 0
            fi
            git commit -m "Publish Jarvis VC41 male Brazilian voice candidate"
            if git push origin HEAD:main; then
              echo "VC41_GITHUB_CATALOG_REGISTERED"
              exit 0
            fi
          done
          echo "Could not publish VC41 catalog after four attempts." >&2
          exit 1

      - name: Sync the live VOC Lab catalog in Supabase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("gl/dist/publish.json").read_text(encoding="utf-8"))
          if (report.get("versionCode"), report.get("versionName")) != (41, "0.3.16"):
              raise SystemExit("The published APK is not VC41")
          if not report.get("apkUrl", "").endswith("Jarvis-0.3.16-vc41.apk"):
              raise SystemExit("Unexpected published APK URL")
          if len(report.get("sha256", "")) != 64:
              raise SystemExit("Invalid APK SHA-256")
          PY
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fkhinnoxpesnhtmmvrken.supabase.co%2Ffunctions%2Fv1%2Fjarvis-vc38-build-oidc"
          VERCEL_OIDC_TOKEN="$(curl --connect-timeout 15 --max-time 30 -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          HTTP_CODE="$(curl --connect-timeout 15 --max-time 30 -sS -w '%{http_code}' -o "$RUNNER_TEMP/voc-lab-catalog-sync.json" -X POST -H "Authorization: Bearer ${VERCEL_OIDC_TOKEN}" -H "x-action: publish-catalog" -H "Content-Type: application/json" --data-binary @gl/dist/publish.json "$JARVIS_BUILD_ENDPOINT")"
          cat "$RUNNER_TEMP/voc-lab-catalog-sync.json"
          test "$HTTP_CODE" = "200"
          python3 - "$RUNNER_TEMP/voc-lab-catalog-sync.json" <<'PY'
          import json, sys
          result = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if not result.get("ok") or result.get("versionCode") != 41 or result.get("versionName") != "0.3.16":
              raise SystemExit("Live VOC Lab catalog did not confirm VC41")
          print("LIVE_VOC_LAB_CATALOG_VC41_OK")
          PY

      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-vc41-build-evidence
          path: |
            gl/dist/**
          if-no-files-found: warn
          retention-days: 7
